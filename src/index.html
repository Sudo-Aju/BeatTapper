<!DOCTYPE html>
<html>
    <head>
        <title>BeatTapper</title>
        <link rel="stylesheet" href="styles.css?v=9">
    </head>
<body>

    <section id="main-menu" class="screen">
        <div class="window-title">
            <span>BeatTapper</span>
            <div class="window-buttons" aria-label="Window controls">
                <button type="button" class="window-button is-min" aria-label="Mninimize"></button>
                <button type="button" class="window-button is-max" aria-label="Maximize"></button>
                <button type="button" class="window-button is-close" aria-label="Close"></button>
            </div>
        </div>
        <button id="btnPlay" class="primary">Play</button>
        <small id="creditsLabel">Built by Azmeer with love ❤️, UI inspired from <a href="https://github.com/DonChiaQE/win95">@DonChiaQE</a></small>
    </section>

    <section id="song-select" class="screen" hidden>
        <div class="window-title">
            <span>Select Level</span>
            <div class="window-buttons" aria-label="Window controls">
                <button type="button" class="window-button is-min" aria-label="Minimize"></button>
                <button type="button" class="window-button is-max" aria-label="Maximize"></button>
                <button type="button" class="window-button is-close" aria-label="Close"></button>
            </div>
        </div>
        <div id="songsList" aria-label="Level selection"></div>
    </section>
    
    <section id="game-container" class="screen" hidden> 
        <div class="window-title">
            <span>BeatTapper</span>
            <div class="window-buttons" aria-label="Window controls">
                <button type="button" class="window-button is-min" aria-label="Minimize"></button>
                <button type="button" class="window-button is-max" aria-label="Maximize"></button>
                <button type="button" class="window-button is-close" aria-label="Close"></button>
            </div>
        </div>
        <div id="game-stage">
            <div id="hud">
                <small>Score</small>
                <div id="score">00000000</div>
            </div>

            <div id="playfield-shell">
                <div id="comboWrap">
                    <div id="combo">0</div>
                    <small>Combo</small>
                </div>

                <div id="lane-frame">
                    <div id="lane-grid" aria-hidden="true">
                        <div class="lane lane-1"></div>
                        <div class="lane lane-2"></div>
                        <div class="lane lane-3"></div>
                        <div class="lane lane-4"></div>
                    </div>
                    <canvas id="gameCanvas"></canvas>
                    <div id="judgement-line" aria-hidden="true"></div>
                    <div id="judgement" aria-live="polite"></div>
                </div>

                <div id="error-bar" aria-hidden="true">
                    <div id="error-bar-labels">
                        <span class="error-bar-label left">Early</span>
                        <span class="error-bar-label left">Lane Monitor</span>
                        <span class="error-bar-label left">Late</span>
                    </div>
                    <div id="error-lane-grid">
                        <div class="error-lane lane-1" data-lane="0">
                            <div class="error-lane-meter"></div>
                        </div>
                        <div class="error-lane lane-2" data-lane="1">
                            <div class="error-lane-meter"></div>
                        </div>
                        <div class="error-lane lane-3" data-lane="2">
                            <div class="error-lane-meter"></div>
                        </div>
                        <div class="error-lane lane-4" data-lane="3">
                            <div class="error-lane-meter"></div>
                        </div>
                    </div>
                    <div id="error-bar-center"></div>
                    <div id="errorMarkers"></div>
                </div>

                <div id="keys" aria-hidden="true">
                    <div class="key-slot lane-1" data-lane="0">A</div>
                    <div class="key-slot lane-1" data-lane="1">S</div>
                    <div class="key-slot lane-1" data-lane="2">D</div>
                    <div class="key-slot lane-1" data-lane="3">F</div>
                </div>
            </div>
        </div>
    </section>

    <section id="result-screen"  class="screen" hidden>
        <div class="results-card">
            <div class="window-title">
                <span>Results</span>
                <div class="window-buttons" aria-label="Window controls">
                    <button type="button" class="window-button is-min" aria-label="Minimize"></button>
                    <button type="button" class="window-button is-max" aria-label="Maximize"></button>
                    <button type="button" class="window-button is-close" aria-label="Close"></button>
                </div>
            </div>
            <small>Results</small>
            <div class="result-stat">
                <span>Final Score</span>
                <strong id="resultScore">0</strong>
            </div>
            <div class="result-stat">
                <span>Max Combo</span>
                <strong id="resultCombo">0</strong>
            </div>
            <button id="btnBackToMenu" class="primary">Back To Menu</button>
        </div>
    </section>

    <script src="main.js?v=4"></script>   
</body>
</html>
